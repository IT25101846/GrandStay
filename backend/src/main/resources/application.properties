spring.application.name=backend
server.port=8080

# ===================================================================
# DATABASE CONFIGURATION — Microsoft SQL Server (Active)
# ===================================================================
spring.datasource.url=${JDBC_URL:jdbc:sqlserver://localhost:1433;databaseName=hotel_db;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${JDBC_USERNAME:sa}
spring.datasource.password=${JDBC_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===================================================================
# H2 In-Memory (Disabled — uncomment below and comment above to use)
# ===================================================================
# spring.datasource.url=jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver

# JWT Secret Key for Authentication
# A unique 32-byte-or-longer value is required outside tests. Do not commit a production secret.
jwt.secret=${JWT_SECRET:0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF}

# Comma-separated browser origins permitted to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Spring Data JPA / Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
